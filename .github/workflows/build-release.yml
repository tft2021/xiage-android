name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 若仓库配置了正式签名 Secret 则使用之，否则用仓库内测试 keystore（由 app/build.gradle.kts 自动回落）
      - name: 注入正式签名密钥（如已配置）
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "XIAOZHI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "XIAOZHI_STORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "XIAOZHI_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "XIAOZHI_KEY_PASSWORD=$KS_KEY_PW" >> "$GITHUB_ENV"
            echo "使用仓库 Secret 中的正式密钥"
          else
            echo "未配置签名 Secret，使用仓库内测试 keystore"
          fi

      - name: 单元测试（core-protocol）
        working-directory: ./xiaozhi-android
        run: gradle :core-protocol:test --no-daemon

      - name: 构建 Release APK
        id: build
        working-directory: ./xiaozhi-android
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 构建日志默认只有登录 GitHub 才能下载，失败时把日志落到 ci-logs 分支便于排查
      - name: 归档构建日志到 ci-logs 分支
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . --quiet || true
          mkdir -p logs
          cp "$RUNNER_TEMP/build.log" "logs/run-${{ github.run_id }}.txt"
          git add logs
          git commit -m "CI 日志 run #${{ github.run_id }}（构建失败）" --quiet
          git push -f origin ci-logs

      - name: 构建失败即中止
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::assembleRelease 失败，日志已归档到 ci-logs 分支 logs/run-${{ github.run_id }}.txt"
          exit 1

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-android-release
          path: xiaozhi-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" xiaozhi-android/app/build/outputs/apk/release/*.apk --generate-notes --title "$GITHUB_REF_NAME"
