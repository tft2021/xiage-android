name: Build Release APK

on:
  push:
    branches: [ main ]
    paths:
      - "xiaozhi-android/**"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run core-protocol unit tests
        working-directory: xiaozhi-android
        run: gradle :core-protocol:test --no-daemon --stacktrace

      - name: Build release APK
        working-directory: xiaozhi-android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-release-apk
          path: xiaozhi-android/app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "xiaozhi APK $TAG" \
            --notes "自动化构建。安装包为 CI 测试签名（仅供测试，正式发布需更换私有 keystore）。" \
            xiaozhi-android/app/build/outputs/apk/release/*.apk
